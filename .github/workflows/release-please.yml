name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      core_release_created: ${{ steps.release.outputs['file-configuration-storage--release_created'] }}
      test_release_created: ${{ steps.release.outputs['file-configuration-storage-test--release_created'] }}
      core_tag_name: ${{ steps.release.outputs['file-configuration-storage--tag_name'] }}
      test_tag_name: ${{ steps.release.outputs['file-configuration-storage-test--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.core_release_created == 'true' || needs.release-please.outputs.test_release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag name
        id: tag
        run: |
          TAG="${{ needs.release-please.outputs.core_tag_name }}"
          if [ -z "$TAG" ]; then TAG="${{ needs.release-please.outputs.test_tag_name }}"; fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag_name }}

      - name: Set up Java with GPG and Central credentials
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn --batch-mode deploy -P release
