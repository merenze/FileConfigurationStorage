name: Publish Snapshot

on:
  push:
    branches-ignore:
      - main

permissions:
  packages: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve snapshot version
        id: version
        run: |
          BASE=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT$//')
          echo "snapshot_version=${BASE}-SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Set snapshot version in pom.xml
        run: |
          mvn --batch-mode versions:set \
            -DnewVersion=${{ steps.version.outputs.snapshot_version }} \
            -DgenerateBackupPoms=false

      - name: Build and publish snapshot
        run: mvn --batch-mode deploy
