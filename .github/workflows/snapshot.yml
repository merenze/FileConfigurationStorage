name: Publish Snapshot

on:
  push:
    branches-ignore:
      - main

permissions:
  packages: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Resolve snapshot version
        id: version
        run: |
          BASE=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT$//')
          echo "snapshot_version=${BASE}-SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Set snapshot version in pom.xml
        run: |
          mvn --batch-mode versions:set \
            -DnewVersion=${{ steps.version.outputs.snapshot_version }} \
            -DgenerateBackupPoms=false

      - name: Configure Maven settings
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const os = require('os');
            const path = require('path');
            const m2Dir = path.join(os.homedir(), '.m2');
            fs.mkdirSync(m2Dir, { recursive: true });
            const settings = `<settings>
              <servers>
                <server>
                  <id>github</id>
                  <username>${{ github.actor }}</username>
                  <password>${{ secrets.GITHUB_TOKEN }}</password>
                </server>
              </servers>
            </settings>`;
            fs.writeFileSync(path.join(m2Dir, 'settings.xml'), settings);

      - name: Build and publish snapshot
        run: mvn --batch-mode deploy
